name: Build and publish Mousike

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and source ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          chmod 600 release-signing.jks
          cat > keystore-final.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release-signing.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 keystore-final.properties

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "Mousike-v${VERSION_NAME}.apk"
          zip -qr "Mousike-v${VERSION_NAME}-source.zip" . \
            -x './.git/*' './.gradle/*' './.kotlin/*' './app/build/*' './build/*' \
               './local.properties' './keystore.properties' './keystore-final.properties' \
               './release-signing.jks' './Mousike-v*.apk' './Mousike-v*-source.zip' \
               './*.jks' './*.keystore' './*.p12'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mousike ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Mousike-v*.apk
            Mousike-v*-source.zip
